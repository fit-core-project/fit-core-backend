spring.application.name=fit-core-api
# active profile: SPRING_PROFILES_ACTIVE 환경변수로 지정 (local / prod)
# 1. Database 설정 — env 기반, 모든 프로파일 공통 (프로파일별 파일에서 override 가능)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/fit_core}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# 2. AI 서버 주소 — env 기반, 모든 프로파일 공통
ai.server.url=${AI_BASE_URL:http://localhost:8000}/api/ai
# 3. JWT — 기본값 없음, prod는 JWT_SECRET env 필수 / local은 profile override 사용
jwt.secret=${JWT_SECRET}
jwt.token-validity-in-seconds=3600
# 3. 공통 JPA/SQL 설정
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# sql.init는 Flyway가 대체 — 전 환경 비활성화
spring.sql.init.mode=never
# Flyway (스키마 형상 관리)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true