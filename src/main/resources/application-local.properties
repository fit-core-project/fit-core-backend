# 1. Database 설정 (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3307/fit_core
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# 2. JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# 3. JWT 설정
jwt.secret=fitcore-api-server-auth-token-secret-key-for-jwt-signing-algorithm-hs512-security-standard-2026-v1
jwt.token-validity-in-seconds=3600
# 4. OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=887026605617-ij5i397ubt85foa4mb8s6dbk7nfmcl55.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=profile,email
# 5. OAuth2 - Kakao (Registration)
spring.security.oauth2.client.registration.kakao.client-id=발급받은_카카오_REST_API_키
spring.security.oauth2.client.registration.kakao.client-secret=발급받은_카카오_시크릿(보안탭에서활성화시)
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
