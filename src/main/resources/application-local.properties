app.env=local
app.auth.demo-token-enabled=true

# 1. Database/AI URL은 base application.properties에서 env로 관리 (이 파일에선 제거)
# sql.init은 Flyway가 대체 — 비활성화
spring.sql.init.mode=never
# 2. JPA 설정 (Flyway가 스키마를 100% 통제 → validate로 drift 감지)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# Swagger 설정 (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# 3. JWT — DEV ONLY throwaway (local profile override). prod는 JWT_SECRET env 필수, 이 값 사용 금지.
jwt.secret=local-dev-throwaway-do-not-use-in-production-replace-with-JWT_SECRET-env
# OAuth2 등록은 OAuth2ClientRegistrationConfig.java에서 env 기반으로 관리 (property 방식 제거)
